# ═══════════════════════════════════════════════════════════════════
# ~/.tmux.conf
# Prefix: C-a   Theme: Catppuccin mocha   Requires: tmux >= 3.3
# ═══════════════════════════════════════════════════════════════════

# ── Prefix: C-b → C-a ───────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix          # C-a C-a → pass prefix to a NESTED/remote tmux

# ── Terminal: truecolor + Claude Code compatibility ─────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"      # 24-bit color (tmux >=3.2)
set -g  allow-passthrough on                         # CC notifs/progress (tmux >=3.3)
set -s  extended-keys on                             # Shift+Enter in Claude Code
set -as terminal-features 'xterm*:extkeys'

# ── Sensible base ───────────────────────────────────────────────────
set -g  mouse on
set -g  base-index 1                 # windows start at 1
setw -g pane-base-index 1            # panes start at 1
set -g  renumber-windows on          # no gaps when a window closes
set -g  history-limit 50000
set -sg escape-time 0                # no ESC lag in nvim
set -g  focus-events on              # nvim autoread + smart-splits
set -g  set-clipboard on             # OSC52 clipboard (tmux-yank / EC2)

# ── Window naming: running process, not hostname ────────────────────
set -g  allow-rename off             # ignore shell title escapes (hostname source)
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# ── vi copy-mode (system clipboard via tmux-yank) ───────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# 'y' copy → provided by tmux-yank (OSC52-aware, works on EC2)

# ── Splits: prefix vs (vertical) / prefix hs (horizontal), open in cwd
# Two-key sequences via per-direction key tables (mirrors nvim <leader>vs / hs)
bind v switch-client -T split_v
bind-key -T split_v s split-window -h -c "#{pane_current_path}"
bind h switch-client -T split_h
bind-key -T split_h s split-window -v -c "#{pane_current_path}"
# defaults kept as fallback
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ── Seamless nav with nvim (smart-splits; nvim side wired at L4) ─────
bind C-l send-keys 'C-l'

# ── Sessions: sesh (fuzzy project jump) ─────────────────────────────
bind o display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list --icons | fzf --reverse --ansi)"'
bind L run-shell 'sesh last'          # jump to previous session

# ── Reload ──────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Persistence (resurrect + continuum) ─────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ═══════════════════════════════════════════════════════════════════
# Catppuccin (via TPM — see plugin list below). Options are set here
# BEFORE `run tpm` so the theme picks them up when it loads. status-left
# /right use `#{E:...}` WITHOUT -F, so they resolve at draw time (after
# TPM sources catppuccin); continuum (last plugin) then appends its hook.
# ═══════════════════════════════════════════════════════════════════
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'                 # window NAME, not pane title
set -g @catppuccin_window_current_text ' #W'
set -g status-left ""
set -ag status-left  "#{E:@catppuccin_status_session}"
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{prefix_highlight}"           # from tmux-prefix-highlight

# ── Plugins (TPM) ── continuum MUST be last in this list ────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# smart-splits resize keys (nav C-hjkl are the plugin's defaults)
set -g @smart-splits_resize_left_key  'M-h'
set -g @smart-splits_resize_down_key  'M-j'
set -g @smart-splits_resize_up_key    'M-k'
set -g @smart-splits_resize_right_key 'M-l'

run '~/.tmux/plugins/tpm/tpm'         # keep LAST

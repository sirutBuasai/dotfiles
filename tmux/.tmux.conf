# -- prefix ----------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix                 # C-a C-a → pass prefix to a NESTED/remote tmux

# -- terminal --------------------------------------------------------
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"        # 24-bit color
set -g  allow-passthrough on                          # CC notifs/progress
set -s  extended-keys on                              # Shift+Enter
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q' # vi-mode cursor shape through tmux

# -- defaults --------------------------------------------------------
set -g  mouse on
set -g  base-index 1                 # windows start at 1
setw -g pane-base-index 1            # panes start at 1
set -g  renumber-windows on          # no gaps when a window closes
set -g  history-limit 50000
set -sg escape-time 0                # no ESC lag in nvim
set -g  focus-events on              # nvim autoread + smart-splits
set -g  set-clipboard on             # OSC52 clipboard (tmux-yank / EC2)
set -g  set-titles on                # let the outer terminal title track tmux
set -g  set-titles-string "#S: #W"   # → "session: window"

# -- window naming ---------------------------------------------------
set -g  allow-rename off             # ignore shell title escapes (hostname source)
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# -- vi copy-mode ----------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# -- splits ----------------------------------------------------------
bind v switch-client -T split_v
bind-key -T split_v s split-window -h -c "#{pane_current_path}"
bind h switch-client -T split_h
bind-key -T split_h s split-window -v -c "#{pane_current_path}"
# defaults kept as fallback
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# -- tmux clean, conflict with nvim ----------------------------------
bind C-l send-keys 'C-l'

# -- sesh ------------------------------------------------------------
bind o display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list --icons | fzf --reverse --ansi)"'
bind L run-shell 'sesh last'          # jump to previous session

# -- reload / pane ---------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind R respawn-pane -k                # kill + restart the shell/program in this pane

# -- resurrect + continuum -------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# -- themes ----------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'                 # window NAME, not pane title
set -g @catppuccin_window_current_text ' #W'
# Lengths — defaults (10/40) truncate the session + right side, and the
# truncation also clips the trailing separator (that's why the session
# collides with the first window when cut off). Give them room.
set -g status-left-length  25
set -g status-right-length 50

set -g status-left ""
set -ag status-left  "#{E:@catppuccin_status_session}"
set -ag status-left  " "                             # gap before the window list
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{prefix_highlight}"           # from tmux-prefix-highlight

# -- plugins ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# smart-splits resize keys (nav C-hjkl are the plugin's defaults)
set -g @smart-splits_resize_left_key  'M-h'
set -g @smart-splits_resize_down_key  'M-j'
set -g @smart-splits_resize_up_key    'M-k'
set -g @smart-splits_resize_right_key 'M-l'

# -- auto-install TPM ------------------------------------------------
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
if "test ! -d ~/.tmux/plugins/tmux" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'         # keep LAST
